<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joni Godwin — Project</title>
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/Images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Verwijs naar je afzonderlijke CSS bestand -->
    <link rel="stylesheet" href="css/editorial.css" />
  </head>
  <body class="project-page">
    <div class="editorial-shell">
      <header class="topbar">
        <a class="back-link" href="#" onclick="window.history.back(); return false;">← Back</a>
        <div class="portfolio-brand">Joni Godwin Portfolio</div>
      </header>

      <main class="editorial-main">
        <!-- Dynamische content container -->
        <div id="project-container"></div>
      </main>
      
      <footer class="site-footer">
        <div class="footer-links">
          <a href="https://linkedin.com/in/jonigodwin" target="_blank">Linkedin</a>
          <a href="mailto:info@studiojoons.com">Email</a>
        </div>
        <div class="footer-bottom">
          <div class="footer-brand">
            <span class="brand-line"></span>
            <strong>PORTFOLIO JONI GODWIN</strong>
          </div>
          <div class="footer-copyright">
            &copy; Joni Godwin 2026 | KVK: 98562851 | BTW: NL005338627B22
          </div>
        </div>
      </footer>
    </div>

    <!-- Data en Script -->
    <script src="css/js/projects.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        const container = document.getElementById('project-container');
        const project = projectsData[projectId];
        
        if (project) {
          document.title = `Joni Godwin — ${project.title}`;

          // Genereer de full-screen afbeeldingen op basis van de content array in projects.js
          let imagesHTML = '';
          if (project.content) {
            project.content.forEach(block => {
              // We doorzoeken alle items binnen blokken (of direct images) om ze als full-screen weer te geven
              let itemsToRender = block.items || (block.left ? block.left.concat(block.right || []) : []);
              itemsToRender.forEach(item => {
                if (item.type === 'image') {
                  imagesHTML += `
                    <div class="fullscreen-image-wrapper fade-in">
                      <img src="${item.src}" alt="${project.title} visual" />
                    </div>
                  `;
                }
              });
            });
          }

          let html = `
            <div class="editorial-header fade-in">
              <h1 class="project-title accent-text">${project.title}</h1>
            </div>
            
            <div class="editorial-intro fade-in">
              <p>${project.intro}</p>
            </div>

            <div class="editorial-gallery">
              ${imagesHTML}
            </div>
          `;
          
          container.innerHTML = html;

        } else {
          container.innerHTML = `<h1>Project not found</h1><p>Sorry, this project doesn't exist.</p>`;
        }

        // Fade-in observer
        const fadeElements = document.querySelectorAll('.fade-in');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.05, rootMargin: "0px 0px -50px 0px" });

        fadeElements.forEach(el => observer.observe(el));
      });
    </script>
  </body>
</html>
