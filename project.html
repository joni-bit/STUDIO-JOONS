    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        const container = document.getElementById('project-container');
        const isPreview = urlParams.get('preview') === '1';
        const found = projectsData[projectId];
        // Drafts are hidden unless opened with &preview=1
        const project = found && (found.status !== 'draft' || isPreview) ? found : null;

        if (project && project.status === 'draft') {
          const robots = document.createElement('meta');
          robots.name = 'robots';
          robots.content = 'noindex, nofollow';
          document.head.appendChild(robots);
          const badge = document.createElement('div');
          badge.textContent = 'Draft preview: not visible on the site';
          badge.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9999;background:#ff7a1a;color:#fff;font:600 13px/1 Inter,system-ui,sans-serif;padding:10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none;';
          document.body.appendChild(badge);
        }
        
        if (project) {
          document.title = `Joni Godwin — ${project.title}`;

          // Grey box that reserves space for an image that isn't ready yet
          const placeholder = (label, ratio) =>
            `<div class="project-placeholder" style="aspect-ratio: ${ratio || '3 / 2'};"><span>${label || 'Image coming soon'}</span></div>`;

          const renderItems = (items) => {
            if (!items) return '';
            return items.map(item => {
              if (item.type === 'text') {
                return item.content === 'Style Guide' 
                  ? `<h3 class="style-guide-title">${item.content}</h3>` 
                  : `<p class="project-text">${item.content}</p>`;
              }
              if (item.type === 'placeholder' || (item.type === 'image' && !item.src)) {
                return placeholder(item.label, item.ratio);
              }
              if (item.type === 'image') {
                return `<img class="project-image" src="${item.src}" alt="Project visual" loading="lazy" decoding="async" />`;
              }
              if (item.type === 'video') {
                return `
                  <div class="project-video fade-in">
                    <video src="${item.src}" class="project-image" autoplay loop muted playsinline style="width: 100%; border-radius: 12px;"></video>
                  </div>
                `;
              }
              if (item.type === 'youtube') {
                return `
                  <div class="project-video fade-in" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.05);">
                    <iframe src="https://www.youtube.com/embed/${item.src}?rel=0" 
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                  </div>
                `;
              }
              if (item.type === 'lottie') {
                return `
                  <div class="project-lottie fade-in">
                    <lottie-player 
                      src="${item.src}" 
                      background="transparent" 
                      speed="1" 
                      style="width: 100%; height: auto; border-radius: 12px;" 
                      loop 
                      autoplay>
                    </lottie-player>
                  </div>
                `;
              }
              if (item.type === 'carousel') {
                let slides = item.images.map(img => `<img class="carousel-slide" src="${img}" alt="Carousel slide" loading="lazy" decoding="async" />`).join('');
                return `
                  <div class="project-carousel-wrapper fade-in">
                    <button class="carousel-btn prev-btn" aria-label="Previous image">←</button>
                    <div class="project-carousel">
                      ${slides}
                    </div>
                    <button class="carousel-btn next-btn" aria-label="Next image">→</button>
                  </div>
                `;
              }
              if (item.type === 'marquee') {
                let imagesHTML = item.images.map(img => `<img class="marquee-img" src="${img}" alt="UI Screen" />`).join('');
                return `
                  <div class="project-marquee-wrapper fade-in">
                    <div class="project-marquee-track">
                      <div class="content">${imagesHTML}</div>
                      <div class="content">${imagesHTML}</div>
                    </div>
                  </div>
                `;
              }
              return '';
            }).join('');
          };

          // Text in [square brackets] is a fact still to fill in: highlight it so it's easy to spot
          const fill = (t) => (t || '').replace(/\[([^\]]+)\]/g, '<mark class="fill-in">[$1]</mark>');

          // One image, video or placeholder. item = { src, label, caption, alt }
          const media = (item, ratio) => {
            if (!item) return '';
            if (!item.src) return placeholder(item.label, ratio);
            if (/\.(mp4|webm)$/i.test(item.src)) {
              return `<video class="block-media" src="${item.src}" autoplay loop muted playsinline${item.poster ? ` poster="${item.poster}"` : ''}></video>`;
            }
            return `<img class="block-media" src="${item.src}" alt="${item.alt || item.label || project.title}" loading="lazy" decoding="async" />`;
          };
          const figure = (item, ratio) => `<figure class="block-figure">${media(item, ratio)}${item && item.caption ? `<figcaption>${fill(item.caption)}</figcaption>` : ''}</figure>`;
          const caption = (block) => block.caption ? `<p class="block-caption">${fill(block.caption)}</p>` : '';

          // The eight layout blocks from the visual plan (A–H), plus text sections
          const renderBlock = (block) => {
            const items = block.items || (block.item ? [block.item] : []);
            switch (block.type) {
              case 'brandscroll':  // Brand in daily use: radio dial + rolodex per brand (brands.js)
                return `<div class="bs-scroll"></div>`;
              case 'section':
                return `<section class="case-section fade-in">
                  ${block.heading ? `<h3 class="case-heading">${block.heading}</h3>` : ''}
                  ${(block.text || []).map(t => `<p class="project-text">${fill(t)}</p>`).join('')}
                  ${block.list ? `<ul class="case-list">${block.list.map(li => `<li>${fill(li)}</li>`).join('')}</ul>` : ''}
                </section>`;
              case 'hero':      // A
              case 'breakdown': // D
              case 'canvas':    // E
                return `<div class="case-block block-wide fade-in">${figure(items[0], block.ratio || '16 / 9')}${caption(block)}</div>`;
              case 'split':     // B
                return `<div class="case-block block-split fade-in">${items.map(i => figure(i, block.ratio || '4 / 5')).join('')}</div>${caption(block)}`;
              case 'triptych':  // C
                return `<div class="case-block block-triptych fade-in">${items.map(i => figure(i, block.ratio || '4 / 5')).join('')}</div>${caption(block)}`;
              case 'grid':      // F
                return `<div class="case-block block-grid cols-${block.columns || 3} fade-in">${items.map(i => figure(i, block.ratio || '1 / 1')).join('')}</div>${caption(block)}`;
              case 'inset':     // G
                return `<div class="case-block block-inset fade-in">${figure(items[0], block.ratio || '4 / 3')}${figure(items[1], '4 / 5')}</div>${caption(block)}`;
              case 'loops':     // H
                return `<div class="case-block block-loops fade-in">${items.map(i => figure(i, i.ratio || '16 / 9')).join('')}</div>${caption(block)}`;
              default:
                return '';
            }
          };

          const hero = project.hero || (project.heroImage ? { src: project.heroImage } : { label: 'Hero image' });
          const facts = project.facts || [['Client', project.client], ['Role', project.role], ['Year', project.year]].filter(f => f[1]);

          let html = `
            <div class="project-header fade-in">
              <h1 class="project-title accent-text">${project.title}</h1>
              ${facts.length ? `
              <dl class="project-meta">
                ${facts.map(([k, v]) => `<div${String(v).length > 40 ? ' class="is-long"' : ''}><dt>${k}</dt><dd>${fill(v)}</dd></div>`).join('')}
              </dl>` : ''}
            </div>
            
            <div class="project-hero-image fade-in" style="transition-delay: 0.1s;">
              ${hero.src ? media(hero) : placeholder(hero.label || 'Hero image', hero.ratio || '16 / 9')}
              ${hero.caption ? `<p class="block-caption">${fill(hero.caption)}</p>` : ''}
            </div>

            ${(project.hook || project.intro) ? `
            <div class="project-intro fade-in" style="transition-delay: 0.2s;">
              <h2>${fill(project.hook || project.intro)}</h2>
            </div>` : ''}
            
            <div class="project-blocks">
              ${(project.blocks || []).map(renderBlock).join('')}
          `;

          (project.content || []).forEach((block) => {
            if (block.type === 'two-column') {
              html += `
                <div class="project-row two-col fade-in">
                  <div class="col-left">${renderItems(block.left)}</div>
                  <div class="col-right">${renderItems(block.right)}</div>
                </div>
              `;
            } else if (block.type === 'full-width') {
              html += `
                <div class="project-row full-width fade-in">
                  ${renderItems(block.items)}
                </div>
              `;
            } else if (block.type === 'two-column-1-2') {
              html += `
                <div class="project-row two-col-1-2 fade-in">
                  <div class="col-left">${renderItems(block.left)}</div>
                  <div class="col-right">${renderItems(block.right)}</div>
                </div>
              `;
            } else if (block.type === 'three-column') {
              html += `
                <div class="project-row three-col fade-in">
                  <div class="col-left">${renderItems(block.left)}</div>
                  <div class="col-middle">${renderItems(block.middle)}</div>
                  <div class="col-right">${renderItems(block.right)}</div>
                </div>
              `;
            } else if (block.type === 'edge-to-edge') {
              html += `
                <div class="project-row edge-to-edge fade-in">
                  ${renderItems(block.items)}
                </div>
              `;
            }
          });

          html += `</div>`;

          // "Next project" link: the next live project in projects.js (loops around)
          const liveIds = Object.keys(projectsData).filter(id => projectsData[id].status === 'live');
          const nextId = liveIds.length ? liveIds[(liveIds.indexOf(projectId) + 1) % liveIds.length] : null;
          if (nextId && nextId !== projectId) {
            const next = projectsData[nextId];
            html += `
            <a class="project-next fade-in" href="project.html?id=${encodeURIComponent(nextId)}">
              <span class="project-next-label">Next project</span>
              <span class="project-next-title">${next.title} &rarr;</span>
            </a>
            <a class="project-all-link" href="work">All work</a>`;
          }

          container.innerHTML = html;
          if (window.initBrandScroll && container.querySelector('.bs-scroll')) initBrandScroll();

          const carousels = document.querySelectorAll('.project-carousel-wrapper');
          carousels.forEach(wrapper => {
            const track = wrapper.querySelector('.project-carousel');
            const prev = wrapper.querySelector('.prev-btn');
            const next = wrapper.querySelector('.next-btn');
            
            prev.addEventListener('click', () => {
              track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' });
            });
            next.addEventListener('click', () => {
              track.scrollBy({ left: track.clientWidth, behavior: 'smooth' });
            });
          });

        } else {
          container.innerHTML = `<h1>Project not found</h1><p>Sorry, this project doesn't exist.</p>`;
        }

        const fadeElements = document.querySelectorAll('.fade-in');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.05, rootMargin: "0px 0px -50px 0px" });

        fadeElements.forEach(el => observer.observe(el));
      });
    </script>
  
    <!-- Menu hides when you scroll down and comes back when you scroll up (same as the other pages) -->
    <script>
      (function () {
        const navWrapper = document.querySelector('.floating-nav-wrapper');
        if (!navWrapper) return;
        let lastY = window.pageYOffset, ticking = false;
        const threshold = 10, pinOffset = 60;
        window.addEventListener('scroll', () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            const y = window.pageYOffset, d = y - lastY;
            if (y <= pinOffset || d < -threshold) navWrapper.classList.remove('nav-hidden');
            else if (d > threshold) navWrapper.classList.add('nav-hidden');
            lastY = Math.max(0, y);
            ticking = false;
          });
        }, { passive: true });
      })();
    </script>
