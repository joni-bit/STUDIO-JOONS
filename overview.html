 <!-- voor de effecten fade in -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const fadeElements = document.querySelectorAll('.fade-in');
        
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target); // Zorgt ervoor dat de animatie maar 1x gebeurt
            }
          });
        }, {
          threshold: 0.1, // Trigger als 10% van het element in beeld is
          rootMargin: "0px 0px -50px 0px" // Wacht iets langer met animeren voor een mooier effect
        });

        fadeElements.forEach(el => observer.observe(el));
      });
    </script>
