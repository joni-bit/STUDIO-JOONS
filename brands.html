<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="Assets/Images/favicon.png">
  <title>Joni Godwin — Brand in daily use (prototype)</title>
  <!-- PROTOTYPE: not linked from the site yet. -->
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/style.css?v=20261123a" />
  <link rel="stylesheet" href="css/brands.css?v=20261123d" />
</head>
<body class="brands-page">
  <header class="topbar">
    <div class="header-brand-wrapper">
      <a href="about" class="profile-hover-btn" aria-label="About Joni Godwin">
        <div class="profile-backdrop"></div>
        <img src="Assets/Images/IMG4456.webp" alt="Joni Godwin" class="profile-img" />
      </a>
      <a href="index" class="brand-name">JONI GODWIN</a>
    </div>
    <div class="floating-nav-wrapper">
      <nav class="floating-nav" aria-label="Primary navigation">
        <a href="index">Home</a>
        <a href="work" aria-current="page">Work</a>
        <a href="about">About</a>
        <a href="shop" class="nav-btn">Shop</a>
      </nav>
    </div>
  </header>

  <!-- Brand backgrounds, cross-faded by script -->
  <div class="bs-backdrop" aria-hidden="true">
    <div class="bs-bg" data-for="veronica"></div>
    <div class="bs-bg" data-for="100nl"></div>
    <div class="bs-bg" data-for="slam"><span class="bs-stripes is-left"></span><span class="bs-stripes is-right"></span></div>
  </div>

  <!-- Radio dial: glass ring with a pointer; stations around it, the current logo in the middle -->
  <nav class="bs-radio" aria-label="Tune in to a brand">
    <div class="bs-ring"></div>
    <div class="bs-pointer-arm"><span class="bs-pointer"></span></div>
    <button class="bs-knob" type="button" aria-label="Next station">
      <img class="bs-knob-logo" data-for="veronica" src="Assets/icons/clients/radio-veronica.webp" alt="" />
      <img class="bs-knob-logo is-dark" data-for="100nl" src="Assets/icons/clients/100pnl.webp" alt="" />
      <img class="bs-knob-logo" data-for="slam" src="Assets/icons/clients/slam.webp" alt="" />
    </button>
    <button class="bs-station" type="button" data-target="veronica" style="--a:-50deg" aria-label="Radio Veronica"><span class="ico-v">V</span></button>
    <button class="bs-station" type="button" data-target="100nl" style="--a:0deg" aria-label="100% NL"><span class="ico-100">100%</span></button>
    <button class="bs-station" type="button" data-target="slam" style="--a:50deg" aria-label="SLAM!"><svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg></button>
  </nav>

  <main>
    <section class="bs-brand" id="veronica" data-bg="#1a9bff" data-ink="#ffffff" aria-label="Radio Veronica">
      <div class="bs-stage">
        <div class="bs-wheel">
          <button class="bs-card" type="button" aria-label="Show De Beste Muziekquiz Allertijden"><img src="Assets/Projecten/MediahuisRadio/web/veronica-muziekquiz.webp" alt="De Beste Muziekquiz Allertijden" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Het Radio Veronica Café key visual"><img src="Assets/Projecten/MediahuisRadio/web/cafe-key-visual.webp" alt="Het Radio Veronica Café key visual" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show DJ live in the Café studio"><img src="Assets/Projecten/MediahuisRadio/web/cafe-studio.webp" alt="DJ live in the Café studio" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show De Fluisteraar"><img src="Assets/Projecten/MediahuisRadio/web/veronica-fluisteraar.webp" alt="De Fluisteraar" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Love at First Ride, with Efteling"><img src="Assets/Projecten/MediahuisRadio/web/veronica-efteling.webp" alt="Love at First Ride, with Efteling" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Café coaster in the bar"><img src="Assets/Projecten/MediahuisRadio/web/cafe-coaster.webp" alt="Café coaster in the bar" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Muziekquiz Top 3000 edition"><img src="Assets/Projecten/MediahuisRadio/web/muziekquiz-top3000.webp" alt="Muziekquiz Top 3000 edition" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Het Radio Veronica Café social post"><img src="Assets/Projecten/MediahuisRadio/web/veronica-cafe.webp" alt="Het Radio Veronica Café social post" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show De Beste Muziekquiz Allertijden logo"><img src="Assets/Projecten/MediahuisRadio/web/muziekquiz-logo.webp" alt="De Beste Muziekquiz Allertijden logo" loading="lazy" /></button>
        </div>
      </div>
    </section>
    <section class="bs-brand" id="100nl" data-bg="#f07d00" data-ink="#141414" aria-label="100% NL">
      <div class="bs-stage">
        <div class="bs-wheel">
          <button class="bs-card" type="button" aria-label="Show Tijdmachine Jaren 80"><img src="Assets/Projecten/MediahuisRadio/web/tijdmachine-80.webp" alt="Tijdmachine Jaren 80" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Tijdmachine Jaren 90"><img src="Assets/Projecten/MediahuisRadio/web/tijdmachine-90.webp" alt="Tijdmachine Jaren 90" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Tijdmachine Jaren 00"><img src="Assets/Projecten/MediahuisRadio/web/tijdmachine-00.webp" alt="Tijdmachine Jaren 00" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Tijdmachine logo"><img src="Assets/Projecten/MediahuisRadio/web/tijdmachine-chosen.webp" alt="Tijdmachine logo" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show 100% NL Sinterklaas"><img src="Assets/Projecten/MediahuisRadio/web/100nl-sinterklaas.webp" alt="100% NL Sinterklaas" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show 100% NL Top 1000"><img src="Assets/Projecten/MediahuisRadio/web/100nl-top1000.webp" alt="100% NL Top 1000" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Somertijd BBQ cards"><img src="Assets/Projecten/MediahuisRadio/web/100nl-somertijd.webp" alt="Somertijd BBQ cards" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show 100% NL Tijdmachine"><img src="Assets/Projecten/MediahuisRadio/web/100nl-tijdmachine.webp" alt="100% NL Tijdmachine" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Tijdmachine logo concepts"><img src="Assets/Projecten/MediahuisRadio/web/tijdmachine-concepts.webp" alt="Tijdmachine logo concepts" loading="lazy" /></button>
        </div>
      </div>
    </section>
    <section class="bs-brand" id="slam" data-bg="#121212" data-ink="#ffffff" aria-label="SLAM!">
      <div class="bs-stage">
        <div class="bs-wheel">
          <button class="bs-card" type="button" aria-label="Show Festivalmaand 9:16"><img src="Assets/Projecten/MediahuisRadio/web/festivalmaand-story.webp" alt="Festivalmaand 9:16" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Summer 500"><img src="Assets/Projecten/MediahuisRadio/web/summer500-final.webp" alt="Summer 500" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Alaafondshow"><img src="Assets/Projecten/MediahuisRadio/web/slam-alaafondshow.webp" alt="Alaafondshow" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Gok van je leven story"><img src="Assets/Projecten/MediahuisRadio/web/gok-story.webp" alt="Gok van je leven story" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Festivalmaand wristband"><img src="Assets/Projecten/MediahuisRadio/web/festivalmaand-wristband.webp" alt="Festivalmaand wristband" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Gok van je leven winners"><img src="Assets/Projecten/MediahuisRadio/web/slam-gok-winners.webp" alt="Gok van je leven winners" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Summer 500 social post"><img src="Assets/Projecten/MediahuisRadio/web/slam-summer500.webp" alt="Summer 500 social post" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Festivalmaand social post"><img src="Assets/Projecten/MediahuisRadio/web/slam-festivalmaand.webp" alt="Festivalmaand social post" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Gok van je leven post"><img src="Assets/Projecten/MediahuisRadio/web/gok-post.webp" alt="Gok van je leven post" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Summer 500 version"><img src="Assets/Projecten/MediahuisRadio/web/summer500-v4.webp" alt="Summer 500 version" loading="lazy" /></button>
          <button class="bs-card" type="button" aria-label="Show Festivalmaand sketch"><img src="Assets/Projecten/MediahuisRadio/web/festivalmaand-wip5.webp" alt="Festivalmaand sketch" loading="lazy" /></button>
        </div>
      </div>
    </section>
    <div class="bs-end" data-bg="#f3f0ea" data-ink="#141414"></div>
  </main>

  <!-- Hover a card for 1 second (or click / Enter) and it comes out of the wheel -->
  <div class="bs-pop" aria-hidden="true"><img alt="" /></div>

  <script src="css/js/brands.js?v=20261123c"></script>
</body>
</html>
